<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name = "description" content="Tasks page...">
	<meta name= "author" content="Pavlos Papachrysanthou">
	<meta name = "keywords" content="HTML">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
	<link rel= "stylesheet" type="text/css" href="styles.css">
    <script src="script.js" defer></script>
	<script src="workout_table.js" defer></script>
	<title>Tasks Page</title>
</head>
<body>
    <header>
		<div id="navbar-placeholder"></div>
	</header>
	
	
	<!--Second header-->
	<div id="page_title">
		<div>
			<h1 id="workout_page_title">Workout Tracker</h1>
			<p id="workout_page_subtitle">Plan, track and crush your gym sessions</p>
		</div>
		<button id="btn_add" onclick="openAddModal()">	<!-- !!!! Add event listener in the js script !!!! -->
			<i class="bi bi-plus-lg"></i> Add Workout
		</button> 
	</div>

	
	<!--Stats-->
	<div id="stats">
		<div class="stat_card" id="stat_total">
			<div class="stat_top">
				<div class="stat_icon">
					<i class="bi bi-lightning-fill"></i>
				</div>
				<div class="stat_num" id="stat_total_value">0</div>
			</div>
			<div class="stat_label">Total Workouts</div>
		</div>
		
		<div class="stat_card" id="stat_pending">
			<div class="stat_top">
				<div class="stat_icon">
					<i class="bi bi-clock-fill"></i>
				</div>
				<div class="stat_num" id="stat_pending_value">0</div>
			</div>
			<div class="stat_label">Pending</div>
		</div>
		
		<div class="stat_card" id="stat_done">
			<div class="stat_top">
				<div class="stat_icon">
					<i class="bi bi-check2-circle"></i>
				</div>
				<div class="stat_num" id="stat_done_value">0</div>
			</div>
			<div class="stat_label">Completed</div>
		</div>
		
		<div class="stat_card" id="stat_intense">
			<div class="stat_top">
				<div class="stat_icon">
					<i class="bi bi-exclamation-circle-fill"></i>
				</div>
				<div class="stat_num" id="stat_intense_value">0</div>
			</div>
			<div class="stat_label">High Intensity</div>
		</div>
	</div>
	
	<!--Filter Bar-->
	<div id="filter_bar">
		<div id="search_bar">
			<i class="bi bi-search"></i>
			<input type="text" id="search_input" placeholder="Search Workouts" oninput="render_table()">
		</div>
		
		<select class="filter_select" id="filter_status" onchange="render_table()">
			<option value="">All Status</option>
			<option value="Pending">Pending</option>
			<option value="Completed">Completed</option>
		</select>
		
		<select class="filter_select" id="filter_intensity" onchange="render_table()">
			<option value="">All Intensity Levels</option>
			<option value="High">High Intensity</option>
			<option value="Moderate">Moderate</option>
			<option value="Recovery">Recovery</option>
		</select>
	</div>
	
	<!--Table of Workouts-->
	<div id="workout_table">
		<table id="inner_table">
			<thead id="table_thead">
				<tr>  <!-- !!!! Add event listener in the js script !!!! -->
					<th onclick="sort_by('name')">Workout <span class="sort_arrow" id="sort_name">▲</span></th>
					<th onclick="sort_by('muscle')">Muscle Group <span class="sort_arrow" id="sort_muscle">▲</span></th>
					<th onclick="sort_by('intensity')">Intensity<span class="sort_arrow" id="sort_intensity">▲</span></th>
					<th onclick="sort_by('status')">Status <span class="sort_arrow" id="sort_status">▲</span></th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody id="workout_body"></tbody>
		</table>
		<div id="table_footer">Showing 0 of 0 workouts</div>
	</div>
    
	<!--Add/Edit workout-->
	<div class="table_overlay" onclick="handleOverlayClick(event)">
		<div id="table_box">
			<h2 id="option_title">Add Workout</h2>
			<div style="display:flex;flex-direction:column;gap:0.9rem;">
				<div>
					<label class="form_label">Workout Name</label>
					<input type="text" class="form_control" id="inp_name" placeholder="Upper Body">
				</div>
				
				<div>
					<label class="form_label">Muscle Groupe Focus</label>
					<input type="text" class="form_control" id="inp_muscle" placeholder="Chest">
				</div>
				
				<div style="display:flex;gap:0.75rem;">
					<div style="flex:1;">
						<label class="form_label">Intensity</label>
						<select class="form_select" id="inp_intensity">
							<option value="recovery">Recovery</option>
							<option value="moderate">Moderate</option>
							<option value="high_intensity">High Intensity</option>
						</select>
					</div>
					
					<div style="flex:1;">
						<label class="form_label">Status</label>
						<select class="form_select" id="inp_status">
							<option value="pending" selected>Pending</option>
							<option value="completed">Completed</option>
						</select>
					</div>
				</div>
				
				<div>
					<label class="form_label">Exercises, Sets, Duration</label>
					<textarea class="form_control" id="inp_description" placeholder="..."></textarea>
				</div>
			</div>
			
			<div class="table_actions">
				<button class="btn_cancel" onclick="closeModal()">Cancel</button>
      			<button class="btn_save" onclick="saveWorkout()">Save Workout</button>
			</div>
		</div>
	</div>
	
	
	<!--Delete workout-->
	<div class="table_overlay" id="delete_overlay"  onclick="handleDeleteOverlayClick(event)">
		<div id="delete_box">
			<div id="delete_icon"><i class="bi bi-trash3-fill"></i></div>
			<div id="delete_title">Delete Workout?</div>
			<div id="delete_message">This action cannot be undone.</div>
			<div style="display:flex;gap:0.75rem;justify-content:center;">
				<button class="btn_cancel" onclick="closeDeleteModal()">Cancel</button>
      			<button class="btn_danger" onclick="confirmDelete()">Delete</button>
			</div>
		</div>
	</div>
	
    <footer>
		<div id="footer-placeholder"></div>
	</footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
