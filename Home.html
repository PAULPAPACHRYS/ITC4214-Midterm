<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name = "description" content="Home page...">
	<meta name= "author" content="Pavlos Papachrysanthou">
	<meta name = "keywords" content="HTML">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
	<link rel= "stylesheet" type="text/css" href="css/General_styles.css">
	<link rel= "stylesheet" type="text/css" href="css/Home_styles.css">
	<script src="scripts/general_script.js" defer></script>
	<script src="scripts/latest_activity.js" defer></script>
	<title>HomePage</title>
</head>
	
<body>
	<header>
		<div id="navbar-placeholder"></div>
	</header>
	
	<div id="home_page_header">
		<h1>Plan Your Workouts<br>Train Smarter</h1>
		<p>Plan your workout sessions, track performance and reach goals.</p>
	</div>
	
	<div id="home_page_buttons">
		<button class="">Plan your workout</button>
		<button>View Analytics</button>
	</div>
	
	<div id="stat_containers">
		
		<div class="stat_container general_container" id="total_workouts_container">
			<h3 id="total_value">0</h3>
			<p>Total Workouts</p>
		</div>
		
		<div class="stat_container general_container" id="completed_workouts_container">
			<h3 id="completed_value">0</h3>
			<p>Completed Workouts</p>
		</div>
		
		<div class="stat_container general_container" id="pending_workouts_container">
			<h3 id="pending_value">0</h3>
			<p>Pending Workouts</p>
		</div>
	</div>
	
	<div class="general_container" id="latest_activity_container">
		<div id="latest_activity_widget">
			<div id="latest_activity_header">
				<div id="latest_activity_title">
					<div id="latest_activity_icon"><i class="bi bi-activity"></i></div>
					<div>
						<p id="la_title">Latest  Activity</p>
						<p id="la_subtitle">Most recent added workouts</p>
					</div>
				</div>
			</div>
			
			<ul id="activity_list"></ul>
			
			<div id="activity_empty">
				<i class="bi bi-clipboard-x"></i>
				No workouts available, add one to get started!
			</div>
			
			<div id="activity_footer">
				<i class="bi bi-clock" style="font-size:0.75rem"></i>
				<span id="activity_footer_text">-</span>
			</div>
		</div>
	</div>
	
	<footer>
		<div id="footer-placeholder"></div>
	</footer>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
	
</html>
